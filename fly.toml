# fly.toml app configuration file generated for awesome-bot on 2026-05-04T07:38:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'awesome-bot'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'npx prisma migrate deploy'

[env]
  LOG_LEVEL = 'info'
  MAX_FILE_SIZE_MB = '50'
  MAX_MESSAGES_PER_MINUTE = '20'
  NODE_ENV = 'production'
  TEMP_DIR = '/app/temp'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '2gb'
  cpu_kind = 'performance'
  cpus = 1
  memory_mb = 2048
