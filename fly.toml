# fly.toml — Awesome Bot (v2 manifest format)
# Run: fly deploy

app = "awesome-bot"
primary_region = "iad"  # Change to nearest: lhr, fra, sin, syd, etc.

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  MAX_FILE_SIZE_MB = "50"
  TEMP_DIR = "/app/temp"
  MAX_MESSAGES_PER_MINUTE = "20"

# Run DB migrations before each deploy
[deploy]
  release_command = "npx prisma migrate deploy"

# Single VM block — NOT [[vm]] array (array format breaks v2 manifest parsing)
[vm]
  memory = "2gb"
  cpu_kind = "performance"
  cpus = 1

# Minimal HTTP service for Fly health checks
# Bot uses long-polling, not webhooks — but Fly requires a port binding
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

# Persistent volume — uncomment after: fly volumes create bot_temp --size 1
# [[mounts]]
#   source = "bot_temp"
#   destination = "/app/temp"
