# fly.toml — OmegaTech Claude Bot
# Run: fly launch (first time) or fly deploy (updates)

app = "omegatech-claude-bot"
primary_region = "iad"  # Change to your nearest: lhr, fra, sin, syd, etc.

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  MAX_FILE_SIZE_MB = "50"
  TEMP_DIR = "/app/temp"
  MAX_MESSAGES_PER_MINUTE = "20"

# Run DB migrations before each deploy
[deploy]
  release_command = "npx prisma migrate deploy"

[[vm]]
  memory = "8gb"
  cpu_kind = "performance"
  cpus = 2

# No HTTP server needed — this is a polling bot
# But Fly requires a port. We use a minimal health check.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false   # Keep bot always running!
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

# Persistent volume for temp files (optional — temp is ephemeral)
# [[mounts]]
#   source = "bot_temp"
#   destination = "/app/temp"
